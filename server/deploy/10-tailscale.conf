# Drop-in for fintracker.service — goes to /etc/systemd/system/fintracker.service.d/
#
# The server binds to the Pi's Tailscale address (#94), and that address does
# not exist until tailscaled has brought the interface up. Without this ordering
# the bind fails after a reboot and the service is simply dead — while nothing
# about the configuration looks wrong.
#
# Same class of mistake as a missing RequiresMountsFor: an ordering assumption
# that holds every time you test it by hand, because by then everything is
# already running, and fails on the one occasion nobody watches — a boot.
#
# Verified after an actual reboot: NRestarts=0. The service bound the VPN
# address on its first attempt, so this is genuinely sufficient and the healthy
# status is not being bought by Restart=on-failure papering over a failed start.
[Unit]
After=tailscaled.service
Wants=tailscaled.service
