# Drop-in for fintracker.service — goes to /etc/systemd/system/fintracker.service.d/
#
# The JVM exits with 143 (128 + SIGTERM) on an ordinary `systemctl stop`, and
# systemd counts that as a failure. Every intended stop was logged as
#
#     Main process exited, code=exited, status=143/n/a
#     fintracker.service: Failed with result 'exit-code'.
#
# Harmless in effect, misleading in the log: a clean stop reads like a crash.
#
# That distinction is not cosmetic here. Telling a healthy start from one that
# Restart=on-failure caught is what the acceptance test for #94 rested on, and
# it needed NRestarts to answer it. A log where every stop says "Failed" makes
# that question harder for no reason.
#
# With this, a stop logs as "Deactivated successfully" (#105).
[Service]
SuccessExitStatus=143
