# Drop-in for fintracker.service — goes to /etc/systemd/system/fintracker.service.d/
#
# So that a service which rightly refuses to start eventually gives up (#96).
#
# Measured on 2026-09-09: with a deliberately corrupted database the server
# correctly refused to start — and `Restart=on-failure` then restarted it
# forever. NRestarts stood at 16 after barely a minute and kept climbing, the
# state stayed `activating`.
#
# The cause is an arithmetic detail that is easy to miss: by default systemd
# only breaks a restart loop once five starts fall inside ten seconds. With
# `RestartSec=5` plus one or two seconds of JVM startup, a cycle is longer than
# that window — the condition is never met, and the default protection fails to
# apply precisely when it is needed.
#
# Not merely cosmetic in the log: it writes to the SD card continuously, and the
# SD card is the component whose failure this issue is about.
#
# Five attempts in five minutes stays generous for a transient fault — the USB
# stick or Tailscale not being ready at boot. A corrupted database does not get
# better by retrying, and now it ends in `failed`, where it belongs and where it
# gets noticed.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5
