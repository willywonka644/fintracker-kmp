name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # allow manual runs from the Actions tab

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (shared logic, server, desktop UI, Android build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 21, not 17, because 21 is what the Pi runs (#106). Debian 13 carries no
      # OpenJDK 17 any more, so #93 had to take 21 there — and testing against a
      # version nobody runs is the wrong way round for a service that merges
      # account data. The alternative, a third-party Temurin 17 on the Pi, was
      # rejected: a hand-maintained package source on an unattended machine that
      # is supposed to get its security updates through apt.
      #
      # jvmTarget in app and shared stays at 11; the target a module compiles
      # for is independent of the JVM doing the compiling.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Runs the full commonTest + desktopTest suite (business logic + SQL
      # repositories). Android UI is not exercised here; the shared module holds
      # all the money/sync logic and runs headless on the JVM target.
      # The desktop target is enough for the platform code too, since #102: crypto
      # and money formatting live in one jvmSharedMain source set that both Android
      # and desktop compile, so there is no second copy left for this to miss.
      - name: Run shared tests
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:desktopTest --no-daemon

      # The sync server (#88). Added together with the module rather than
      # afterwards: a new module is invisible to CI by default, which is exactly
      # the gap #87 had to close for the app module.
      - name: Run server tests
        run: ./gradlew :server:test --no-daemon

      # The Android half of the project was invisible to CI until #87: the two
      # test tasks above build the desktop target only, so nothing here ever
      # compiled the app module, and nothing compiled shared for Android either
      # — the same commonMain file can compile for desktop and fail for Android,
      # an `expect` without a matching `actual` being the obvious way.
      #
      # assembleDebug rather than compileDebugKotlin: a Kotlin-only compile
      # would miss manifest merges and resource errors, which are Android
      # breakage just as much as a type error is. This step is purely "does it
      # still build".
      - name: Build Android app
        run: ./gradlew :app:assembleDebug --no-daemon

      # The app module's own JVM unit tests. #87 added the build step above and
      # recorded that there were none. There is one class, RecurringRulesScreenTest,
      # and it is the only one in the repo no other step reaches: the three files
      # that used to sit beside it tested shared-module code and were folded into
      # shared/commonTest, which "Run shared tests" already covers. Maestro is the
      # *instrumented* net, which drives the installed app on a device and stays
      # local; these run headless on the JVM like every other test above.
      #
      # Kept separate from the build rather than folded into it: a red test and
      # a broken build are different failures and should read as different steps.
      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Compose Desktop UI tests open a real window, and the runner has no
      # screen. Xvfb provides one that exists only in memory. The depth matters:
      # xvfb-run defaults to 8-bit, which Skiko cannot render into.
      #
      # No install step: xvfb ships on the ubuntu-latest image (24.04 "noble",
      # xvfb 2:21.1.12-1ubuntu1.6). The step that used to sit here ran
      # `apt-get update && apt-get install -y xvfb` and installed nothing —
      # but it did put an Ubuntu mirror in the critical path, and on
      # 2026-08-19 that mirror (azure.archive.ubuntu.com) was down: apt retried
      # it four times and burned 30 minutes before a run was abandoned. A step
      # that cannot succeed at anything can still fail at everything.
      - name: Run desktop UI tests
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            ./gradlew :desktopApp:test --no-daemon

      - name: Upload desktop UI test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-test-report
          path: desktopApp/build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload shared test report
        if: always() # keep the report even when tests fail
        uses: actions/upload-artifact@v7
        with:
          name: shared-test-report
          path: shared/build/reports/tests/desktopTest
          if-no-files-found: ignore

      - name: Upload server test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-report
          path: server/build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload app unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
